name: SonarCloud Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests and generate coverage report
        run: |
          pytest --cov=Deployment --cov-report=xml --cov-report=term

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Download and run SonarScanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner.zip

          export JAVA_HOME=${{ steps.setup-java.outputs.path }}
          export PATH="$JAVA_HOME/bin:$PATH"

          ./sonar-scanner-4.8.0.2856-linux/bin/sonar-scanner \
            -Dsonar.projectKey=Group6 \
            -Dsonar.organization=Steve8695 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=Deployment \
            -Dsonar.exclusions=**/__pycache__/** \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
